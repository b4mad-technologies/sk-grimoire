#:schema https://spellkave.dev/schema/world-manifest-1.0.0.json
schema_version = "1.0.0"

[metadata]
profile = "self_reaction_resolution_flip"

[[bundles]]
bundle_id = "demo_legres"
display_name = "Legendary Resistance Demo"
author = "spellkave"
version = "1.0.0"
description = "Driver fixture for self-eligible reaction windows."

[[resource_definitions]]

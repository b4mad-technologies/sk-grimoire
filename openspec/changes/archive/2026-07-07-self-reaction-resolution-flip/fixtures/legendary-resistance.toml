[[consequence_templates]]
template_id = "demo_legres/save/failure"
bundle_id = "demo_legres"

[[consequence_templates]]
template_id = "demo_legres/save/success"
bundle_id = "demo_legres"

[[consequence_templates]]
template_id = "demo_legres/legendary_resistance/flip"
bundle_id = "demo_legres"

[[consequence_frame_writes]]
template_id = "demo_legres/legendary_resistance/flip"
ordinal = 0
frame_write = { ModifyResource = { actor = "Actor", resource = "demo_legres/legendary_resistance", delta_source = "-1" } }

[[consequence_frame_writes]]
template_id = "demo_legres/legendary_resistance/flip"
ordinal = 1
frame_write = { InsertModifier = { modifier_id = "demo_legres/legendary_resistance/replace_failure/live", applies_when_handle = "", affects_what_handle = "demo_legres/save_outcome", delta_handle = "Replace(demo_legres/save/success)", visibility_handle = "hidden" } }

[[modifier_target_definitions]]
target_id = "demo_legres/save_outcome"
bundle_id = "demo_legres"
shape = "Reference"
display_name = "Save Outcome"

[[modifier_templates]]

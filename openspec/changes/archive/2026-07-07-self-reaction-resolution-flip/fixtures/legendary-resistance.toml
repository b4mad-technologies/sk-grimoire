applies_to = "demo_legres/save_outcome"
display_name = "Legendary Resistance replaces failed save"
predicate_source = "1 == 1"
modifier_expression_source = "1 == 1"
priority = 100
delta_kind = "Replace"
replace_template_id = "demo_legres/save/success"

[[action_definitions]]
action_id = "demo_legres/dragon_save"
bundle_id = "demo_legres"
required_capability = ""
on_success = "demo_legres/legendary_resistance/flip"
on_failure = "demo_legres/save/failure"

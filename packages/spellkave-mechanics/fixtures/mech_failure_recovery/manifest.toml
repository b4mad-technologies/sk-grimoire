[[consequence_frame_writes]]
ordinal = 0
template_id = "mech_failure_recovery/apply_pressure/consequence"

[consequence_frame_writes.frame_write.ModifyResource]
actor = "TargetActor"
delta_source = "-4"
resource = "mech_failure_recovery/capacity"

[[consequence_frame_writes]]
ordinal = 1
template_id = "mech_failure_recovery/apply_pressure/consequence"

[consequence_frame_writes.frame_write.ForEachActorInRadius]
center_ref = "TargetSpatialRef"
predicate_source = "actor.stat('mech_failure_recovery/capacity') <= 0 && actor.has_capability('mech_failure_recovery/capability/risk_check')"
shape_id = "core/area/node_ball"
shape_params_json = '{"ball_radius": 0}'

[[consequence_frame_writes.frame_write.ForEachActorInRadius.body]]

[consequence_frame_writes.frame_write.ForEachActorInRadius.body.ApplyStatus]
condition_definition_id = "mech_failure_recovery/at_risk"
target_kind = "entity"
target_ref = "Actor"

[[consequence_frame_writes]]
ordinal = 0
template_id = "mech_failure_recovery/risk_check/roll/consequence"

[consequence_frame_writes.frame_write.ModifyResource]
actor = "Actor"
delta_source = "d20 - actor.stat('mech_failure_recovery/last_roll')"
resource = "mech_failure_recovery/last_roll"

[[consequence_frame_writes]]
ordinal = 1
template_id = "mech_failure_recovery/risk_check/roll/consequence"

[consequence_frame_writes.frame_write.ModifyResource]
actor = "Actor"
delta_source = "cond(actor.stat('mech_failure_recovery/last_roll') >= 10, 1, 0)"
resource = "mech_failure_recovery/recovery_tally"

[[consequence_frame_writes]]
ordinal = 2
template_id = "mech_failure_recovery/risk_check/roll/consequence"

[consequence_frame_writes.frame_write.ModifyResource]
actor = "Actor"
delta_source = "cond(actor.stat('mech_failure_recovery/last_roll') < 10, 1, 0)"
resource = "mech_failure_recovery/failure_tally"

[[consequence_frame_writes]]
ordinal = 3
template_id = "mech_failure_recovery/risk_check/roll/consequence"

[consequence_frame_writes.frame_write.ForEachActorInRadius]
center_ref = "ActorSpatialRef"
predicate_source = "actor.stat('mech_failure_recovery/recovery_tally') >= 3"
shape_id = "core/area/node_ball"
shape_params_json = '{"ball_radius": 0}'

[[consequence_frame_writes.frame_write.ForEachActorInRadius.body]]

[consequence_frame_writes.frame_write.ForEachActorInRadius.body.ApplyStatus]
condition_definition_id = "mech_failure_recovery/recovered"
target_kind = "entity"
target_ref = "Actor"

[[consequence_frame_writes]]
ordinal = 4
template_id = "mech_failure_recovery/risk_check/roll/consequence"

[consequence_frame_writes.frame_write.ForEachActorInRadius]
center_ref = "ActorSpatialRef"
predicate_source = "actor.stat('mech_failure_recovery/failure_tally') >= 3"
shape_id = "core/area/node_ball"
shape_params_json = '{"ball_radius": 0}'

[[consequence_frame_writes.frame_write.ForEachActorInRadius.body]]

[consequence_frame_writes.frame_write.ForEachActorInRadius.body.ApplyStatus]
condition_definition_id = "mech_failure_recovery/failed"
target_kind = "entity"
target_ref = "Actor"

[[consequence_frame_writes]]
ordinal = 0
template_id = "mech_failure_recovery/assist_recovery/consequence"

[consequence_frame_writes.frame_write.ApplyStatus]
condition_definition_id = "mech_failure_recovery/recovered"
target_kind = "entity"
target_ref = "TargetActor"


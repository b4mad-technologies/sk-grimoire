[[consequence_frame_writes]]
ordinal = 0
template_id = "core/pickup/success"

[consequence_frame_writes.frame_write.Inscribe]
kind = "handled_item"
location_kind = "binding"
location_ref = "ActorSpatialRef"
payload_json = '{"action":"pickup","expires_at_tick":null}'

[[consequence_frame_writes]]
ordinal = 1
template_id = "core/pickup/success"

[consequence_frame_writes.frame_write.PickupTargetItem]
actor_ref = "Actor"

[[consequence_frame_writes]]
ordinal = 0
template_id = "core/drop/success"

[consequence_frame_writes.frame_write.Inscribe]
kind = "handled_item"
location_kind = "binding"
location_ref = "ActorSpatialRef"
payload_json = '{"action":"drop","expires_at_tick":null}'

[[consequence_frame_writes]]
ordinal = 0
template_id = "core/loot/drop_dagger"

[consequence_frame_writes.frame_write.InsertItem]
count = 1
initial_item_state = []
item_def_id = "core/item/loot_dagger"

[consequence_frame_writes.frame_write.InsertItem.destination.Ground.spatial_ref]
id = "TargetSpatialRef"
kind = "binding"

[[consequence_frame_writes]]
ordinal = 0
template_id = "core/equip_torch_light/success"

[consequence_frame_writes.frame_write.EquipItem]
actor_ref = "Actor"
slot_id = "core/main_hand"

[consequence_frame_writes.frame_write.EquipItem.source.TargetItem]

[[consequence_frame_writes]]
ordinal = 1
template_id = "core/equip_torch_light/success"

[consequence_frame_writes.frame_write.Inscribe]
kind = "core/light"
location_kind = "binding"
location_ref = "ActorSpatialRef"
payload_json = '{"source":"torch","expires_at_tick":null}'

[[consequence_frame_writes]]
ordinal = 0
template_id = "core/mark/success"

[consequence_frame_writes.frame_write.Inscribe]
kind = "scrape_marks"
location_kind = "binding"
location_ref = "TargetSpatialRef"
payload_json = '{"action":"mark"}'


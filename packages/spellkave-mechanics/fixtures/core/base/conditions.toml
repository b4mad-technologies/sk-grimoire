[[condition_definitions]]
bundle_id = "core"
condition_definition_id = "core/condition/controlled"
description = "Steering claim-lock (Item 20): applied to a remotely-steered entity while an autonomy claim holds it; the world_tick autonomy dispatcher skips any entity carrying an active instance of this condition. Not a PLAYER-facing condition (sk-eky) — infrastructure for claim/autonomy only."
display_name = "Controlled"
gate_predicate_source = ""
grants_capability_while_active = []
hooks = []
implies = []
modifier_template_id = ""
observable = false
remove_time_policy = "core/remove_policy/independent_lifetime"
stacking_rule = "core/stacking/single"
suppresses_capability_while_active = []

[[condition_definitions]]
bundle_id = "core"
condition_definition_id = "core/condition/incapacitated"
description = "Identity-only cascade target for SRD conditions (Paralyzed/Unconscious/Petrified imply this) — lives in core, not srd, because multiple SRD-family conditions point at it. The SRD-canonical behavioural payload (action-admission, concentration, speech, initiative axes) is substrate-absent today; this row's load-bearing job for now is only to exist as the cascade target."
display_name = "Incapacitated"
gate_predicate_source = ""
grants_capability_while_active = []
hooks = []
implies = ["core/condition/disengaged"]
modifier_template_id = ""
observable = true
remove_time_policy = "core/remove_policy/independent_lifetime"
stacking_rule = "core/stacking/single"
suppresses_capability_while_active = []

[[condition_definitions]]
bundle_id = "core"
condition_definition_id = "core/condition/disengaged"
description = "Session-scoped 'left the fight without being incapacitated' carrier for Phandelver P5's mixed-roster combat endings; session termination predicates exclude by this OR incapacitated so both a defeat and a flee reach the same umbrella tag. Identity-only: no modifier_template, no hooks."
display_name = "Disengaged"
gate_predicate_source = ""
grants_capability_while_active = []
hooks = []
implies = []
modifier_template_id = ""
observable = true
remove_time_policy = "core/remove_policy/independent_lifetime"
stacking_rule = "core/stacking/single"
suppresses_capability_while_active = []


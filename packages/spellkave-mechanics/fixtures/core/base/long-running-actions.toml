# Rendered through `sk render` from the typed manifest schema.

# `schema_json` maps each payload key to its type name. A `?` suffix
# marks an optional key.
[[trace_kind_definitions]]
kind_id = "core/interrupted_work"
bundle_id = "core"
location_kinds = "any"
description = "Perceivable evidence that a promoted action was interrupted before completion."
schema_json = '{"tags":"array"}'

# Describes the payload emitted for departures.
[[trace_kind_definitions]]
kind_id = "core/departure"
bundle_id = "core"
location_kinds = "place_node"
description = "Someone left this place through an exit, and the way they went is still readable here."
schema_json = '{"mover":"integer","via_place_edge_id":"string","exit_label":"string"}'
perceptible_for_ticks = 6


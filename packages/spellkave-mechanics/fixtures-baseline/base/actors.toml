# Hand-authored (#1968). Restores, in a test-only bundle layered on top of
# `core`, the §3.2 clause 3 (identity bootstrapping) and clause 5 (NPC/event
# source) contracts. Both used to be satisfied by core's own `core/player`
# entity + the `core/caravan`-standin `core_baseline/npc` — the later #1968
# "retire Phandalin/village + core/player" slice removed core's structural
# player entirely, so `core_baseline/player` now plays that role here (the
# phandelver-hero pattern: this bundle defines its OWN connectable actor,
# bound to `$sender` the same way `core/player` used to be).

[[entities]]
bundle_id = "core_baseline"
entity_def_id = ""
entity_key = "core_baseline/player"
kind = "player"
name = "Baseline Player"
owned_by_entity_key = ""
place_node_id = "core_baseline_outdoor/plaza"
quantity = 1

[[actors]]
bundle_id = "core_baseline"
entity_key = "core_baseline/player"
name = "Baseline Player"

[[actor_identities]]
bundle_id = "core_baseline"
entity_key = "core_baseline/player"
identity = "$sender"
role = "primary"

[[actor_spatial_locations]]
bundle_id = "core_baseline"
entity_key = "core_baseline/player"
place_node_id = "core_baseline_outdoor/plaza"
selection_path = "manifest:core_baseline/player"


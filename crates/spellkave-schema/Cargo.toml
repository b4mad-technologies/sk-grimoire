[package]
name = "spellkave-schema"
version = "0.2.0"
edition = "2021"
license = "PolyForm-Shield-1.0.0"
publish = false

[dependencies]
schemars = { version = "0.8", features = ["derive"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
spellkave-dsl = { path = "../spellkave-dsl" }

[dev-dependencies]
toml = "0.8"

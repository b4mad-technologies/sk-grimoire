[package]
name = "spellkave-validate-wasm"
version = "0.2.0"
edition = "2021"
license = "PolyForm-Shield-1.0.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spellkave-dsl = { path = "../spellkave-dsl" }
spellkave-format = { path = "../spellkave-format" }
spellkave-schema = { path = "../spellkave-schema" }
spellkave-validate = { path = "../spellkave-validate" }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

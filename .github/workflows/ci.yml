name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build
        run: cargo build --locked --workspace --all-features --target-dir target
      - name: Test
        run: cargo test --locked --workspace --all-features --target-dir target
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --target-dir target -- -D warnings
      - name: Reference docs
        run: cargo run --locked --target-dir target -p spellkave-reference-docs -- --check
      - name: Format
        run: cargo fmt --all --check
      - name: Build Wasm
        run: cargo build --locked --release --target-dir target --target wasm32-unknown-unknown -p spellkave-validate-wasm -p spellkave-authoring-wasm

name: Wasm npm packages

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Select package version
        id: version
        shell: bash
        run: |
          version=0.0.0-ci
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Expected a release tag of the form vMAJOR.MINOR.PATCH"
              exit 1
            fi
            version=${GITHUB_REF_NAME#v}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version '=0.2.120' --locked --target-dir target
      - name: Build and pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/build-wasm-npm.mjs "$VERSION"
      - name: Test installed packages in Node and Chrome
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/test-wasm-npm.mjs "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-npm
          path: target/wasm-npm/${{ steps.version.outputs.version }}/*.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: [validate-wasm, authoring-wasm]
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-npm
      - name: Publish tested tarball using npm Trusted Publishing
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ needs.build.outputs.version }}
        run: npm publish "./spellkave-$PACKAGE-$VERSION.tgz" --provenance --access public
